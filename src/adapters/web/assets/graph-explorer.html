<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/pwa-icon.svg" type="image/svg+xml">
<title>pAI Graph Explorer</title>
<script src="/app-shell.js" defer></script>
<script src="/viewport.js" defer></script>
<script src="/graph-explorer.js" defer></script>
<style>
  :root { --bg:#0b0f14;--panel:#10151c;--border:#223042;--text:#e6edf3;--dim:#8b98a5;--accent:#5fb3ff;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  * { box-sizing:border-box; }
  html,body { width:100%;height:100vh;margin:0;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--mono); }
  #app { position:fixed;inset:0;display:flex;flex-direction:column;min-height:0; }
  header { flex:0 0 auto;padding:calc(8px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) 8px calc(14px + env(safe-area-inset-left));border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center; }
  h1 { font-size:13px;margin:0;color:var(--dim);letter-spacing:.03em; }
  .workspace { flex:1 1 auto;min-height:0;display:grid;grid-template-columns:minmax(250px,330px) 1fr; }
  aside { min-height:0;overflow:auto;padding:12px;border-right:1px solid var(--border);background:var(--panel); }
  form { display:grid;gap:9px; }
  label { display:grid;gap:4px;color:var(--dim);font-size:11px; }
  input,select,button { font:13px var(--mono); }
  input,select { width:100%;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:8px; }
  button.primary { background:var(--accent);color:#04121e;border:0;border-radius:7px;padding:9px;cursor:pointer;font-weight:600; }
  #summary { margin:12px 0;color:var(--dim);font-size:11px;white-space:pre-wrap; }
  #details { border-top:1px solid var(--border);padding-top:10px;font-size:11px;line-height:1.5;overflow-wrap:anywhere; }
  #details pre { margin:0;white-space:pre-wrap;font:inherit; }
  #details button { margin-top:10px;width:100%;background:transparent;color:var(--accent);border:1px solid var(--border);border-radius:7px;padding:8px;cursor:pointer;font:12px var(--mono); }
  .stage { min-width:0;min-height:0;overflow:auto;position:relative; }
  svg { display:block;width:100%;height:100%;min-width:620px;min-height:520px; }
  .edge { stroke:#49647f;stroke-width:1.5;fill:none; }
  .edge-label { fill:var(--dim);font-size:10px;text-anchor:middle; }
  .node { cursor:pointer; }
  .node circle { fill:#132232;stroke:#5fb3ff;stroke-width:1.5; }
  .node.selected circle { fill:#214b6d;stroke:#a9d8ff;stroke-width:2.5; }
  .node text { fill:var(--text);font-size:11px;text-anchor:middle;pointer-events:none; }
  #empty { position:absolute;inset:0;display:grid;place-items:center;color:var(--dim);padding:30px;text-align:center;pointer-events:none; }
  @media(max-width:720px){ .workspace{grid-template-columns:1fr;grid-template-rows:auto 1fr}.workspace aside{border-right:0;border-bottom:1px solid var(--border);max-height:42vh}.stage{min-height:0}svg{min-width:520px;min-height:440px} }
</style>
</head>
<body>
<div id="app">
  <header><h1>PAI GRAPH EXPLORER</h1><div class="btns"></div></header>
  <div class="workspace">
    <aside>
      <form id="search-form">
        <label>Find nodes or relationships<input id="query" maxlength="1000" required placeholder="pets, health history, projects..."></label>
        <label>Maximum depth<select id="depth"><option value="1">1</option><option value="2" selected>2</option><option value="3">3</option></select></label>
        <label>Evidence<select id="evidence"><option value="verified" selected>Verified</option><option value="all">Include hypotheses</option></select></label>
        <button class="primary" type="submit">Search graph</button>
      </form>
      <div id="summary" role="status" aria-live="polite">Enter a natural-language query.</div>
      <div id="details"><pre>Select a node or relationship to inspect its compact descriptor.</pre></div>
    </aside>
    <main class="stage"><svg id="graph" role="img" aria-label="Knowledge graph search result"></svg><div id="empty">Search the live knowledge graph. Details load without entering the conversation or model context.</div></main>
  </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script src="/viewport.js" defer></script>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/pwa-icon.svg" type="image/svg+xml">
<title>Sign in to pAI</title>
<style>
  :root { color-scheme: dark; --bg:#0b0f14; --panel:#10151c; --border:#223042; --text:#e6edf3; --dim:#8b98a5; --accent:#5fb3ff; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  * { box-sizing: border-box; }
  html, body { width:100%; height:100vh; margin:0; overflow:hidden; background:var(--bg); color:var(--text); font-family:var(--mono); }
  body { position:fixed; inset:0; display:grid; place-items:center; overflow:auto; padding:calc(20px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right)) calc(20px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left)); }
  main { width:min(100%, 390px); padding:24px; border:1px solid var(--border); border-radius:12px; background:var(--panel); box-shadow:0 18px 60px rgba(0,0,0,.35); }
  h1 { margin:0 0 8px; font-size:18px; }
  p { margin:0 0 20px; color:var(--dim); font-size:12px; line-height:1.5; }
  label { display:block; margin:12px 0 5px; color:var(--dim); font-size:11px; }
  input, button { width:100%; min-height:44px; border-radius:8px; font:16px var(--mono); }
  input { border:1px solid var(--border); background:var(--bg); color:var(--text); padding:9px 11px; }
  input:focus { outline:none; border-color:var(--accent); }
  button { margin-top:18px; border:0; background:var(--accent); color:#04121e; font-weight:700; cursor:pointer; }
  button:disabled { opacity:.55; cursor:default; }
  #status { min-height:18px; margin-top:12px; color:#ff9b9b; font-size:11px; }
</style>
</head>
<body>
<main>
  <h1>pAI Terminal</h1>
  <p>Sign in with the same private web-terminal credential. It stays in this secure app session and is not saved in browser storage.</p>
  <form id="login-form">
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" value="pai" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
    <button id="submit" type="submit">Sign in</button>
    <div id="status" role="status" aria-live="polite"></div>
  </form>
</main>
<script>
const form = document.getElementById('login-form');
const submit = document.getElementById('submit');
const status = document.getElementById('status');
form.addEventListener('submit', async event => {
  event.preventDefault();
  submit.disabled = true;
  status.textContent = '';
  try {
    const response = await fetch('/api/v2/login', {
      method: 'POST',
      headers: {'Content-Type':'application/json', 'X-PAI-Request':'same-origin'},
      credentials: 'same-origin',
      body: JSON.stringify({username: form.username.value, password: form.password.value})
    });
    const result = await response.json();
    if (!response.ok || !result.ok) throw new Error('Sign-in failed');
    form.password.value = '';
    location.replace(result.redirect || '/terminal');
  } catch (_) {
    form.password.value = '';
    status.textContent = 'Sign-in failed. Check the username and password.';
    submit.disabled = false;
    form.password.focus();
  }
});
</script>
</body>
</html>
